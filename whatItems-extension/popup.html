<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f9fafb; color: #111827; }
    .header { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
    .preview { display: flex; align-items: center; gap: 10px; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 12px; }
    .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #f3f4f6; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .site { font-size: 12px; font-weight: 600; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-preview { font-size: 11px; color: #9ca3af; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; background: #fff; font-family: inherit; color: #111827; }
    input, select { height: 34px; padding: 0 10px; }
    textarea { resize: vertical; min-height: 54px; line-height: 1.4; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
    button { width: 100%; height: 38px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 12px; text-align: center; font-weight: 500; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .warn { color: #d97706; }
  </style>
</head>
<body>
  <div class="header">📦 whatItems에 저장</div>

  <div class="preview">
    <img id="thumb" class="thumb" src="" alt="" />
    <div class="info">
      <div id="siteName" class="site">-</div>
      <div id="urlText" class="url-preview">-</div>
    </div>
  </div>

  <div class="field">
    <label for="title">이름 (제목)</label>
    <textarea id="title" rows="2" placeholder="저장할 이름을 입력하세요"></textarea>
  </div>

  <div class="field">
    <label for="category">카테고리</label>
    <select id="category">
      <option value="기타">기타</option>
    </select>
  </div>

  <div class="field">
    <label for="price">가격 (선택)</label>
    <input id="price" type="text" placeholder="예: 29,000원" />
  </div>

  <button id="saveBtn">저장하기</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
